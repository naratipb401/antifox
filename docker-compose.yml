services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-antifox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-antifox}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-antifox} -d ${POSTGRES_DB:-antifox}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  antifox:
    image: ghcr.io/antifox-ai/antifox:${ANTIFOX_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ANTIFOX_PG_DSN: postgres://${POSTGRES_USER:-antifox}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-antifox}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTIFOX_LLM_PROVIDER: ${ANTIFOX_LLM_PROVIDER:-}
      ANTIFOX_LLM_MODEL: ${ANTIFOX_LLM_MODEL:-}
      ANTIFOX_LLM_BASE_URL: ${ANTIFOX_LLM_BASE_URL:-}
      ANTIFOX_LLM_PROXY: ${ANTIFOX_LLM_PROXY:-}
    ports:
      - "8787:8787"
      - "8788:8788"
    volumes:
      # Bind the data directory (jwt.key, SQLite, etc.) to ./data in the repo root
      # so the host can inspect/backup it directly and it survives container recreation.
      - ./data:/app/data
      # Mount the repo's skills/ over the image-bundled /app/skills;
      # edit skills without rebuilding the image — the container reads the host copy.
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
